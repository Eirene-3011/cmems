# Netlify configuration for CMEMS frontend

[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to Render backend — replace YOUR_RENDER_URL before deploying
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_URL.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — all client-side routes served from index.html (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
